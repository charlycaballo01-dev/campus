<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f3a1a">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Campus Virtual">
<title>C.A.E.R. · Plataforma de alumnos</title>
<style>
  :root{
    --bg-page:#F8F6EE;
    --bg-panel:#FFFFFF;
    --bg-panel-2:#DDEEE5;
    --bg-soft:#FCFBF6;
    --line:#E7E2D3;
    --text-primary:#21322A;
    --text-muted:#777777;
    --gold:#C79A33;
    --gold-soft:#7A5C1E;
    --gold-dim:#E8D3A0;
    --green-line:#184F36;
    --green-deep:#DDEEE5;
    --forest:#184F36;
    --forest-2:#143B2A;
    --green-text:#143B2A;
    --rust:#A8552E;
    --rust-dim:#F3E6DD;
    --rust-text:#7A3B1D;
    --font-display:'Cormorant Garamond', 'Fraunces', Georgia, serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'Inter', -apple-system, sans-serif;
    --radius-lg:20px;
    --radius-md:12px;
    --ease:200ms cubic-bezier(.4,0,.2,1);
  }
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700;800&display=swap');

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg-page);
    color:var(--text-primary);
    font-family:var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
  }
  ::selection{background:var(--gold-dim); color:var(--text-primary);}

  .brand-defs{position:absolute; width:0; height:0; overflow:hidden;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 36px;
    background:var(--bg-panel);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-display); font-weight:600; font-size:1.28rem; letter-spacing:0.01em;
    color:var(--forest);
  }
  .brand svg{width:30px; height:27px; flex-shrink:0;}
  .nav-tabs{display:flex; gap:30px;}
  .nav-tabs button{
    background:none; border:none; border-bottom:2px solid transparent;
    color:var(--text-primary); font-family:var(--font-body); font-size:0.82rem; font-weight:600;
    letter-spacing:0.03em; text-transform:uppercase;
    padding:8px 1px; cursor:pointer;
    transition:color var(--ease), border-color var(--ease);
  }
  .nav-tabs button:hover{color:var(--forest); border-bottom-color:var(--gold);}
  .nav-tabs button.active{color:var(--forest); border-bottom-color:var(--gold);}
  .nav-tabs{align-items:center;}
  .user-chip{
    font-family:var(--font-body); font-size:0.8rem; color:var(--text-muted); font-weight:600;
    display:flex; align-items:center; gap:9px;
  }
  .user-chip .avatar{
    width:30px;height:30px;border-radius:50%;
    background:var(--forest);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display); font-weight:600; color:var(--gold-dim); font-size:0.82rem;
  }

  .view{display:none;}
  .view.active{display:block;}

  #view-auth{min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; background:var(--bg-page);}
  .auth-scale{
    width:1040px; min-width:1040px; flex-shrink:0;
    display:flex;
    transform-origin:center center;
  }
  .auth-side{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding:60px 70px; position:relative; overflow:hidden;
  }
  .auth-side.brand-side{
    background:var(--bg-page);
    border-right:1px solid var(--line);
    align-items:center; text-align:center;
  }
  .eyebrow{
    font-family:var(--font-body); font-size:0.72rem; font-weight:700; letter-spacing:0.16em;
    color:var(--gold-soft); text-transform:uppercase; margin-bottom:18px; line-height:1.5;
  }
  .brand-row{display:flex; flex-direction:column; align-items:center; gap:9px; margin-bottom:18px;}
  .brand-logo{display:none;}
  .caer-logo{width:58px;height:58px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--gold);box-shadow:0 5px 16px rgba(24,79,54,.12);}
  .brand-caption{line-height:1.6;}
  .brand-caption .bc-name{
    display:block; font-family:var(--font-display); font-weight:700; font-size:1.5rem;
    letter-spacing:0.08em; color:var(--forest);
  }
  .brand-caption .bc-full{
    display:block; font-family:var(--font-body); font-weight:500; font-size:0.72rem;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--text-muted); margin-top:4px;
  }
  .topbar-logo{
    width:40px; height:40px; border-radius:50%; object-fit:cover; flex-shrink:0;
    border:1px solid var(--line);
  }
  h1.hero-title{
    font-family:var(--font-display); font-weight:600; font-size:3.25rem; line-height:1.02;
    max-width:520px; margin:0 auto 16px; color:var(--forest); text-align:center;
  }
  h1.hero-title em{color:var(--gold); font-style:italic; display:block; margin-top:2px;}
  .hero-sub{color:var(--text-muted); max-width:400px; line-height:1.6; font-size:.92rem; margin:0 auto 16px; text-align:center;}

  /* Composición editorial del acceso: replica la portada institucional. */
  .auth-side.brand-side{flex:1.18; padding:28px 38px 24px;}
  .auth-form-side{flex:.82; padding:24px 20px;}
  .brand-row{gap:13px; margin-bottom:30px;}
  .caer-logo{width:66px; height:66px;}
  .brand-caption .bc-name{font-size:1.78rem; letter-spacing:.12em;}
  .brand-caption .bc-full{font-size:.68rem; line-height:1.7; letter-spacing:.13em; margin-top:7px;}
  h1.hero-title{font-size:3.35rem; line-height:.98; margin-bottom:17px;}
  h1.hero-title em{margin-top:7px;}
  .hero-sub{max-width:470px; color:var(--forest); font-size:.96rem; line-height:1.65; margin-bottom:12px;}

  .ekg-wrap{width:100%; max-width:720px; position:relative; margin:0 auto; padding:0;}
  .ekg-video{display:block; width:100%; height:auto;}
  @media (prefers-reduced-motion:reduce){.ekg-video{animation-play-state:paused;}}

  @media(max-width:700px){
    .topbar{flex-wrap:wrap; row-gap:10px; padding:10px 16px;}
    .brand{font-size:1.05rem;}
    .nav-tabs{order:3; width:100%; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; justify-content:flex-start;}
    .nav-tabs button{padding:6px 4px; font-size:.72rem; white-space:nowrap; flex-shrink:0;}
    .user-chip{font-size:.72rem; gap:6px; flex-shrink:0;}
    .user-chip .avatar{width:24px;height:24px;font-size:.7rem;}
  }

  @media(max-width:820px){
    #view-auth{align-items:flex-start; overflow-y:auto; height:auto; padding:0;}
    .auth-scale{
      width:100%; min-width:0; flex-shrink:1;
      flex-direction:column; transform:none !important;
    }
    .auth-side{padding:44px 24px 24px;}
    .auth-side.brand-side{border-right:none; padding-bottom:20px;}
    .auth-side.brand-side{flex:1; padding:44px 24px 20px;}
    .auth-form-side{flex:1; padding:0 24px 44px;}
    .brand-caption .bc-name{font-size:1.15rem;}
    .brand-caption .bc-full{font-size:0.62rem;}
    h1.hero-title{font-size:2.1rem; max-width:100%;}
    .hero-sub{font-size:0.88rem; max-width:100%;}
    .ekg-wrap{margin:0 auto; padding:0;}
    .auth-form-side{padding:0 24px 44px;}
    .auth-card{max-width:100%; padding:28px;}
  }

  .auth-form-side{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding:40px;
  }
  .auth-card{
    width:100%; max-width:380px;
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:40px;
    box-shadow:0 12px 40px rgba(20,59,42,0.06);
  }
  .auth-toggle{
    display:flex; background:var(--bg-panel-2); border-radius:999px; padding:4px; margin-bottom:30px;
  }
  .auth-toggle button{
    flex:1; padding:10px; border:none; background:none; color:var(--forest);
    font-family:var(--font-body); font-weight:600; font-size:0.82rem; border-radius:999px; cursor:pointer;
    transition:all var(--ease);
  }
  .auth-toggle button.active{background:var(--forest); color:#FFFFFF;}
  .field{margin-bottom:16px;}
  .field label{
    display:block; font-size:0.76rem; color:var(--text-muted); margin-bottom:6px;
    font-family:var(--font-body); font-weight:600; letter-spacing:0.02em;
  }
  .field input{
    width:100%; padding:12px 14px; border-radius:var(--radius-md);
    background:var(--bg-panel); border:1px solid var(--line); color:var(--text-primary);
    font-family:var(--font-body); font-size:0.92rem; outline:none;
    transition:border-color var(--ease), box-shadow var(--ease);
  }
  .field input::placeholder{color:#B9B9B9;}
  .field input:focus{border-color:var(--forest); box-shadow:0 0 0 3px var(--green-deep);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .btn-primary{
    width:100%; padding:14px; border:none; border-radius:999px; margin-top:10px;
    background:var(--gold); color:#FFFFFF; font-weight:700; font-size:0.92rem;
    cursor:pointer; transition:background var(--ease), transform var(--ease); font-family:var(--font-body);
  }
  .btn-primary:hover{background:var(--forest); transform:translateY(-1px);}
  .auth-foot{margin-top:20px; text-align:center; font-size:0.82rem; color:var(--text-muted);}
  .auth-foot a{color:var(--forest); font-weight:600;}

  .page{max-width:1100px; margin:0 auto; padding:48px 36px 90px;}
  .page-head{margin-bottom:36px;}
  .page-head .eyebrow{margin-bottom:8px;}
  .page-head h2{font-family:var(--font-display); font-size:2.3rem; font-weight:600; color:var(--forest);}
  .page-head p{color:var(--text-muted); margin-top:8px; font-size:0.95rem; max-width:520px;}

  .subject-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(290px,1fr)); gap:22px;
  }
  .subject-card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:28px; cursor:pointer; transition:transform var(--ease), box-shadow var(--ease), border-color var(--ease);
    position:relative; overflow:hidden;
    box-shadow:0 2px 14px rgba(20,59,42,0.04);
  }
  .subject-card:hover{transform:translateY(-3px); box-shadow:0 14px 30px rgba(20,59,42,0.10); border-color:var(--gold-dim);}
  .subject-card .sc-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; gap:12px;}
  .subject-card h3{font-family:var(--font-display); font-size:1.24rem; font-weight:600; max-width:65%; color:var(--forest); line-height:1.25;}
  .subject-card .sc-pct{
    font-family:var(--font-display); font-size:2.3rem; font-weight:600; line-height:1;
  }
  .pct-green{color:var(--forest);}
  .pct-gold{color:var(--gold-soft);}
  .pct-rust{color:var(--rust-text);}
  .sc-nudge{
    font-size:0.82rem; font-weight:500; margin-bottom:14px; color:var(--text-muted);
  }
  .nudge-green{color:var(--forest);}
  .nudge-gold{color:var(--gold-soft);}
  .nudge-rust{color:var(--rust-text);}
  .pulse-mini{width:100%; height:8px; margin:2px 0 16px; opacity:1; border-radius:99px; overflow:hidden; background:var(--bg-panel-2);}
  .pulse-fill{height:100%; border-radius:99px; transition:width 600ms var(--ease);}
  .sc-meta{display:flex; justify-content:space-between; font-size:0.78rem; color:var(--text-muted); font-family:var(--font-body); margin-bottom:18px;}
  .sc-cta{
    display:inline-block; background:var(--gold); color:#FFFFFF; font-weight:700;
    font-size:0.8rem; padding:9px 20px; border-radius:999px; letter-spacing:0.01em;
    transition:background var(--ease);
  }
  .subject-card:hover .sc-cta{background:var(--forest);}

  .back-link{
    display:inline-flex; align-items:center; gap:6px; color:var(--text-muted);
    font-size:0.84rem; cursor:pointer; margin-bottom:26px; font-family:var(--font-body); font-weight:600;
    transition:color var(--ease);
  }
  .back-link:hover{color:var(--forest);}
  .detail-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; flex-wrap:wrap; gap:16px;}
  .detail-pct{font-family:var(--font-display); font-size:2.8rem; font-weight:600; color:var(--forest);}
  .detail-pct-label{font-size:0.78rem; color:var(--text-muted); font-family:var(--font-body); margin-top:2px;}
  .video-list{display:flex; flex-direction:column; gap:12px; margin-bottom:40px;}
  .video-item{
    display:flex; align-items:center; gap:14px;
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px;
    cursor:pointer; transition:border-color var(--ease), box-shadow var(--ease);
  }
  .video-item:hover{border-color:var(--gold); box-shadow:0 4px 16px rgba(20,59,42,0.05);}
  .video-item .vi-thumb{
    width:64px; height:42px; border-radius:8px; background:var(--bg-panel-2);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    color:var(--forest); font-size:0.7rem;
  }
  .video-item.watched .vi-thumb{background:var(--green-deep); color:var(--forest);}
  .view-dots{display:inline-flex;gap:4px;margin-left:10px;vertical-align:middle}
  .view-dot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .view-dot.dot-red{background:#D64545}
  .view-dot.dot-yellow{background:#E8C547}
  .view-dot.dot-green{background:#3FA34D}
  .video-item .vi-info{flex:1;}
  .video-item .vi-title{font-size:0.92rem; font-weight:500; color:var(--text-primary);}
  .video-item .vi-sub{font-size:0.78rem; color:var(--text-muted); font-family:var(--font-body); margin-top:3px;}
  .vi-status{font-family:var(--font-body); font-weight:600; font-size:0.72rem; padding:5px 11px; border-radius:20px;}
  .vi-status.done{background:var(--green-deep); color:var(--forest);}
  .vi-status.pending{background:var(--bg-panel-2); color:var(--text-muted);}

  .section-label{
    font-family:var(--font-body); font-size:0.74rem; font-weight:700; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--gold-soft); margin-bottom:16px; display:block;
  }

  .quiz-card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:32px; max-width:640px;
    box-shadow:0 2px 14px rgba(20,59,42,0.04);
  }
  .quiz-q-count{font-family:var(--font-body); font-weight:600; font-size:0.78rem; color:var(--gold-soft); margin-bottom:12px; letter-spacing:0.03em; text-transform:uppercase;}
  .quiz-question{font-family:var(--font-display); font-size:1.5rem; font-weight:600; line-height:1.4; margin-bottom:26px; color:var(--forest);}
  .quiz-options{display:flex; flex-direction:column; gap:10px;}
  .quiz-opt{
    text-align:left; padding:14px 18px; border-radius:var(--radius-md); border:1px solid var(--line);
    background:var(--bg-panel); color:var(--text-primary); font-family:var(--font-body); font-size:0.92rem;
    cursor:pointer; transition:all var(--ease);
  }
  .quiz-opt:hover{border-color:var(--gold); background:var(--bg-soft);}
  .quiz-opt.correct{border-color:var(--forest); background:var(--green-deep); color:var(--forest); font-weight:600;}
  .quiz-opt.incorrect{border-color:var(--rust); background:var(--rust-dim); color:var(--rust-text);}
  .quiz-opt:disabled{cursor:default;}
  .feedback{
    margin-top:22px; padding:18px 20px; border-radius:var(--radius-md);
    border-left:3px solid var(--rust); background:var(--rust-dim);
    font-size:0.89rem; line-height:1.6; display:none; color:var(--text-primary);
  }
  .feedback.show{display:block;}
  .feedback.ok{border-left-color:var(--forest); background:var(--green-deep);}
  .feedback strong{display:block; margin-bottom:6px; font-family:var(--font-body); font-size:0.74rem; letter-spacing:0.06em; text-transform:uppercase; font-weight:700;}
  .feedback.ok strong{color:var(--forest);}
  .feedback:not(.ok) strong{color:var(--rust-text);}
  .quiz-next{
    margin-top:20px; background:none; border:1px solid var(--line); color:var(--text-muted);
    padding:10px 18px; border-radius:999px; font-family:var(--font-body); font-weight:600; font-size:0.85rem; cursor:pointer;
    display:none; transition:all var(--ease);
  }
  .quiz-next.show{display:inline-block;}
  .quiz-next:hover{border-color:var(--gold); color:var(--forest);}

  .quiz-cta{
    display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;
    margin-top:8px; padding:26px 30px; border-radius:var(--radius-lg);
    background:var(--forest); color:#FFFFFF;
  }
  .quiz-cta strong{font-family:var(--font-display); font-weight:600; font-size:1.2rem; display:block; margin-bottom:6px;}
  .quiz-cta p{font-size:0.86rem; color:rgba(255,255,255,0.78); max-width:420px; line-height:1.5;}
  .quiz-cta .admin-btn{background:var(--gold); flex-shrink:0;}
  .quiz-cta .admin-btn:hover{background:#FFFFFF; color:var(--forest);}
</style>
<style>
.access-panel{margin:20px 0 30px;padding:26px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--bg-panel);box-shadow:0 2px 14px rgba(20,59,42,.04)}
.access-panel strong{font-family:var(--font-display);font-weight:600;color:var(--forest)}
.access-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}
.access-stat{padding:16px;border-radius:var(--radius-md);background:var(--bg-panel-2);font-size:.82rem;color:var(--text-muted);font-weight:500}
.access-stat strong{display:block;font-family:var(--font-display);font-weight:600;font-size:1.5rem;margin-top:6px;color:var(--forest)}
.subject-locked{opacity:.48;filter:grayscale(.5);cursor:not-allowed!important}
.expiry-ok{color:var(--forest);font-weight:600}
.expiry-warn{color:var(--gold-soft);font-weight:600}
.expiry-bad{color:var(--rust-text);font-weight:600}
.admin-mini{font-size:.82rem;color:var(--text-muted);margin-top:6px}
.reserve-card{padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius-md);margin:10px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--bg-panel);transition:border-color var(--ease)}
.reserve-card:hover{border-color:var(--gold-dim)}
.reserve-actions{display:flex;gap:6px;flex-wrap:wrap}
.admin-btn.small{padding:8px 14px;font-size:.8rem}
@media(max-width:800px){.access-grid{grid-template-columns:repeat(2,1fr)}}
</style>


<style id="admin-panel-styles">
/* --- Admin panel: Notion x Apple, redesigned for C.A.E.R. --- */
.admin-shell{max-width:1200px;margin:0 auto;padding:40px 32px 70px;background:var(--bg-page)}
.admin-topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.admin-kicker{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:700}
.admin-title{font-family:var(--font-display);font-weight:600;font-size:2.1rem;margin:6px 0;color:var(--forest)}
.admin-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px;background:var(--bg-panel-2);padding:5px;border-radius:999px;width:fit-content}
.admin-nav button{border:0;background:none;border-radius:999px;padding:9px 18px;cursor:pointer;font-family:var(--font-body);font-weight:600;font-size:.84rem;color:var(--forest);transition:all var(--ease)}
.admin-nav button.active{background:var(--forest);color:#fff}
.admin-view{display:none}
.admin-view.active{display:block}
.admin-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:26px}
.admin-stat{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;box-shadow:0 2px 14px rgba(20,59,42,.04)}
.admin-stat span{font-size:.8rem;color:var(--text-muted);font-weight:500}
.admin-stat strong{display:block;font-family:var(--font-display);font-weight:600;font-size:2rem;margin-top:8px;color:var(--forest)}
.admin-card{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:26px;margin-bottom:18px;box-shadow:0 2px 14px rgba(20,59,42,.04)}
.admin-card h3{margin:0 0 16px;font-family:var(--font-display);font-weight:600;font-size:1.25rem;color:var(--forest)}
.admin-table{width:100%;border-collapse:collapse}
.admin-table th{padding:10px 10px;text-align:left;font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);font-weight:600;border-bottom:1px solid var(--line)}
.admin-table td{padding:14px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;font-size:.9rem;color:var(--text-primary)}
.admin-badge{display:inline-flex;padding:5px 11px;border-radius:999px;font-size:.76rem;background:var(--bg-panel-2);color:var(--forest);font-weight:600}
.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
.admin-btn{border:0;border-radius:999px;padding:10px 16px;cursor:pointer;background:var(--gold);color:#fff;font-family:var(--font-body);font-weight:600;font-size:.85rem;transition:background var(--ease), transform var(--ease)}
.admin-btn:hover{background:var(--forest);transform:translateY(-1px)}
.admin-btn.secondary{background:var(--bg-panel-2);color:var(--forest)}
.admin-btn.secondary:hover{background:var(--line);transform:none}
.admin-btn.danger{background:var(--bg-panel);color:var(--rust-text);border:1px solid var(--rust-dim)}
.admin-btn.danger:hover{background:var(--rust-dim);transform:none}
.sound-preset-btn.active{background:var(--forest);color:#fff}
  .chime-preset-btn.active{background:var(--forest);color:#fff}
  .report-view-btn.active{background:var(--forest);color:#fff}
  .sound-group-label{font-family:var(--font-body);font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:12px 0 6px}
  .sound-group-label:first-of-type{margin-top:0}
  .sound-presets-row{display:flex;flex-wrap:wrap;gap:8px}
  .app-modal-overlay{position:fixed;inset:0;background:rgba(20,30,25,.5);z-index:1500;display:none;align-items:center;justify-content:center;padding:20px}
  .app-modal-overlay.active{display:flex}
  .app-modal{background:var(--bg-panel,#fff);border-radius:var(--radius-lg);padding:26px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .sleep-choice-btn{flex:1;min-width:84px;line-height:1.7;font-size:.9rem}
  @media print{
    body *{visibility:hidden}
    #weekly-report-content, #weekly-report-content *{visibility:visible}
    #weekly-report-content{position:absolute;top:0;left:0;width:100%}
    .no-print{display:none !important}
  }
@keyframes pomodoroPulse{0%{transform:scale(1);box-shadow:0 6px 20px rgba(20,59,42,.25)}50%{transform:scale(1.12);box-shadow:0 8px 26px rgba(212,160,23,.45)}100%{transform:scale(1);box-shadow:0 6px 20px rgba(20,59,42,.25)}}
#pomodoro-float-btn.pulsing{animation:pomodoroPulse 1s ease-in-out infinite}
.admin-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.admin-form label{display:flex;flex-direction:column;gap:7px;font-size:.82rem;color:var(--text-muted);font-weight:600}
.admin-form input,.admin-form select{padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-md);font-family:var(--font-body);font-size:.9rem;background:var(--bg-panel);color:var(--text-primary);outline:none;transition:border-color var(--ease), box-shadow var(--ease)}
.admin-form input:focus,.admin-form select:focus{border-color:var(--forest);box-shadow:0 0 0 3px var(--green-deep)}
.admin-form .full{grid-column:1/-1}
.package-card{border:1px solid var(--line);border-radius:var(--radius-md);padding:18px;margin-bottom:10px;background:var(--bg-soft)}
.package-card strong{font-family:var(--font-display);font-weight:600;font-size:1.1rem;color:var(--forest)}
.package-meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.update-card{border:1px solid var(--line);border-radius:var(--radius-md);padding:16px 18px;margin-bottom:10px;background:var(--bg-soft);position:relative}
.update-card.pinned{border-color:var(--gold-soft);background:linear-gradient(180deg,rgba(199,154,51,.08),transparent)}
.update-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.update-card h4{margin:0;font-family:var(--font-display);font-weight:600;font-size:1.05rem;color:var(--forest)}
.update-date{font-size:.74rem;color:var(--text-muted);white-space:nowrap;margin-top:3px}
.update-card p{margin:0;font-size:.9rem;color:var(--text-primary);line-height:1.5;white-space:pre-wrap}
.update-pin-tag{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-soft);margin-right:8px}
.updates-feed{max-height:520px;overflow:auto}
.updates-feed-empty{font-size:.88rem;color:var(--text-muted);padding:6px 0}
.dashboard-updates.admin-card{margin-bottom:24px}
.dashboard-updates .update-card:last-child{margin-bottom:0}
@media(max-width:850px){.admin-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.admin-grid,.admin-form{grid-template-columns:1fr}.admin-form .full{grid-column:auto}.admin-topbar{align-items:flex-start;flex-direction:column}}
</style>

</head>
